services:
  postgres:
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-geoai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-geoai}
      - POSTGRES_DB=${POSTGRES_DB:-geoai}
    ports:
      - 5432:5432
  pgadmin:
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - 8080:80
